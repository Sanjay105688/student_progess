<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Progress Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            background: #eee;
            border-radius: 5px;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Progress Form</h2>

    <label>Student Name</label>
    <input type="text" id="name">

    <label>Roll Number</label>
    <input type="text" id="roll">

    <label>Maths Marks</label>
    <input type="number" id="maths">

    <label>Science Marks</label>
    <input type="number" id="science">

    <label>English Marks</label>
    <input type="number" id="english">

    <button onclick="calculateResult()">Generate Progress</button>

    <div class="result" id="result"></div>
</div>

<script>
    function calculateResult() {
        let name = document.getElementById("name").value;
        let roll = document.getElementById("roll").value;

        let maths = Number(document.getElementById("maths").value);
        let science = Number(document.getElementById("science").value);
        let english = Number(document.getElementById("english").value);

        if (!name || !roll) {
            alert("Please enter student details");
            return;
        }

        let total = maths + science + english;
        let average = total / 3;

        let grade;
        let status;

        if (average >= 75) grade = "A";
        else if (average >= 60) grade = "B";
        else if (average >= 50) grade = "C";
        else grade = "D";

        status = average >= 40 ? "Pass" : "Fail";

        document.getElementById("result").innerHTML = `
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Roll No:</strong> ${roll}</p>
            <p><strong>Total Marks:</strong> ${total}</p>
            <p><strong>Average:</strong> ${average.toFixed(2)}</p>
            <p><strong>Grade:</strong> ${grade}</p>
            <p class="${status === "Pass" ? "pass" : "fail"}">
                Result: ${status}
            </p>
        `;
    }
</script>

</body>
</html>
